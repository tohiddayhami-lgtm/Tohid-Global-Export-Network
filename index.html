<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#07070f" />
    <link rel="icon" type="image/svg+xml" sizes="any" href="/favicon.svg?v=container-1" />

    <!-- Base SEO — overridden at runtime by SeoHead component -->
    <title>Tohid Dayhami Business Solutions Center</title>
    <meta name="application-name" content="Tohid Dayhami Business Solutions Center" />
    <meta name="description" content="Tohid Dayhami Business Solutions Center — Premier global trade facilitation hub connecting exporters with verified buyers and distributors across 20+ countries." />
    <meta name="keywords" content="export consulting, global trade, international business, Iran trade, import export, trade network, logistics, business matchmaking" />
    <meta name="author" content="Tohid Dayhami" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Tohid Dayhami Business Solutions Center" />
    <meta property="og:description" content="Explore global export markets through our interactive Tohid Meta Port. Connect with trade partners across 20+ countries." />
    <meta property="og:site_name" content="Tohid Dayhami Business Solutions Center" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tohid Dayhami Business Solutions Center" />
    <meta name="twitter:description" content="Explore global export markets through our interactive Tohid Meta Port." />

    <!-- Preconnect to font origin so DNS/TLS is ready before CSS requests -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Vazirmatn (Persian font) — synchronous so @font-face is parsed before React renders -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300&display=swap" />
    <!-- Load Latin fonts async (non-blocking): media="print" trick swaps to "all" after load -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600;700&display=swap" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300;1,9..144,400;1,9..144,500&family=Inter:wght@300;400;500;600;700&display=swap" /></noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
